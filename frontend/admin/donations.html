<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Donations | Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>
        <main class="admin-main">
            <h1 class="admin-page-title">💰 Manage Donations</h1>
            <div class="admin-toolbar">
                <input type="text" class="admin-search" placeholder="Search donations..." oninput="searchDonations(this.value)">
                <button class="btn btn-primary btn-sm" onclick="exportDonationsPDF()">📄 Export PDF</button>
                <button class="btn btn-outline btn-sm" onclick="exportDonationsCSV()">📥 Export CSV</button>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead><tr><th>Donor</th><th>Email</th><th>Amount</th><th>Type</th><th>Status</th><th>Receipt</th><th>Date</th></tr></thead>
                    <tbody id="all-donations-body"><tr><td colspan="7"><div class="loading-spinner"></div></td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js?v=2.1"></script>
    <script src="/static/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAdminDonations);
        function searchDonations(query) {
            const rows = document.querySelectorAll('#all-donations-body tr');
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(query.toLowerCase()) ? '' : 'none';
            });
        }
        function exportDonationsCSV() {
            const table = document.querySelector('.data-table');
            let csv = [];
            table.querySelectorAll('tr').forEach(row => {
                const cols = [];
                row.querySelectorAll('th, td').forEach(col => cols.push('"' + col.textContent.trim() + '"'));
                csv.push(cols.join(','));
            });
            const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'donations_export.csv';
            a.click();
        }
    </script>
</body>
</html>
