<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Festivals | Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>
        <main class="admin-main">
            <h1 class="admin-page-title">🎉 Manage Festivals</h1>
            <!-- Add Festival Form -->
            <div class="admin-form" style="margin-bottom:var(--space-2xl);">
                <h3>Add New Festival</h3>
                <form onsubmit="addFestival(event)">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);">
                        <div class="form-group"><label class="form-label">Name (English)</label><input id="fest-name-en" class="form-input" required></div>
                        <div class="form-group"><label class="form-label">Name (ಕನ್ನಡ)</label><input id="fest-name-kn" class="form-input" required style="font-family:var(--font-kannada);"></div>
                    </div>
                    <div class="form-group"><label class="form-label">Description (English)</label><textarea id="fest-desc-en" class="form-input" rows="3"></textarea></div>
                    <div class="form-group"><label class="form-label">Description (ಕನ್ನಡ)</label><textarea id="fest-desc-kn" class="form-input" rows="3" style="font-family:var(--font-kannada);"></textarea></div>
                    <div class="form-group"><label class="form-label">Date / Schedule</label><input id="fest-date" class="form-input" placeholder="e.g., January 14 or Every Amavasya"></div>
                    <button type="submit" class="btn btn-primary">Add Festival</button>
                </form>
            </div>
            <!-- Festivals Table -->
            <div class="table-wrapper">
                <table class="data-table">
                    <thead><tr><th>Name (EN)</th><th>Name (KN)</th><th>Date</th><th>Actions</th></tr></thead>
                    <tbody id="festivals-body"><tr><td colspan="4"><div class="loading-spinner"></div></td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js?v=2.1"></script>
    <script src="/static/js/admin.js"></script>
    <script>document.addEventListener('DOMContentLoaded', loadAdminFestivals);</script>
</body>
</html>
