<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>
        <main class="admin-main">
            <h1 class="admin-page-title">👥 Manage Users</h1>
            <div class="admin-toolbar">
                <input type="text" class="admin-search" placeholder="Search users..." oninput="searchUsers(this.value)">
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Status</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead>
                    <tbody id="all-users-body"><tr><td colspan="7"><div class="loading-spinner"></div></td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js?v=2.1"></script>
    <script src="/static/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAdminUsers);
        function searchUsers(query) {
            document.querySelectorAll('#all-users-body tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(query.toLowerCase()) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
