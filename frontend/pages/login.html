<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶ್ರೀ ಶನೀಶ್ವರಸ್ವಾಮಿ ದೇವಸ್ಥಾನ (ರಿ) | Shree Shanishwara Swamy Temple (R.) — Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="temple-icon">
                    <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="temple-logo-svg" style="margin: 0 auto var(--space-md);">
                      <circle cx="50" cy="50" r="46" fill="#0B3D2E" stroke="#D4AF37" stroke-width="4"/>
                      <path d="M45 18 L50 8 L55 18 Z" fill="#D4AF37"/>
                      <path d="M42 20 L58 20 L56 28 L44 28 Z" fill="#D4AF37" stroke="#0B3D2E" stroke-width="0.5"/>
                      <path d="M38 30 L62 30 L59 42 L41 42 Z" fill="#D4AF37" stroke="#0B3D2E" stroke-width="0.5"/>
                      <path d="M32 44 L68 44 L64 60 L36 60 Z" fill="#D4AF37" stroke="#0B3D2E" stroke-width="0.5"/>
                      <path d="M26 62 L74 62 L74 80 L68 80 L68 66 L32 66 L32 80 L26 80 Z" fill="#D4AF37"/>
                      <path d="M50 64 C46 70 46 76 50 78 C54 76 54 70 50 64 Z" fill="#FF8C00"/>
                      <path d="M50 68 C48 72 48 75 50 76 C52 75 52 72 50 68 Z" fill="#FFD700"/>
                      <path d="M42 78 L58 78 L55 82 L45 82 Z" fill="#D4AF37"/>
                      <path d="M18 82 L82 82 L80 86 L20 86 Z" fill="#D4AF37"/>
                    </svg>
                </div>
                <h2 data-i18n="login_title">Welcome Back</h2>
                <p class="auth-subtitle" data-i18n="login_subtitle">Login to your account</p>
            </div>
            <form onsubmit="handleLogin(event)" novalidate>
                <div class="form-group">
                    <label class="form-label" data-i18n="login_email">Email Address</label>
                    <input type="email" id="login-email" class="form-input" placeholder="Enter your email">
                    <span class="form-error" id="error-login-email"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="login_password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" class="form-input" placeholder="Enter your password">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password')">👁️</button>
                    </div>
                    <span class="form-error" id="error-login-password"></span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-xl);">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me" style="font-size:0.85rem;color:var(--text-muted);" data-i18n="login_remember">Remember me</label>
                    </div>
                    <a href="#" style="font-size:0.85rem;color:var(--primary);font-weight:500;" data-i18n="login_forgot">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" data-i18n="login_submit">Login</button>
            </form>
            <div class="auth-links">
                <span data-i18n="login_no_account">Don't have an account?</span>
                <a href="/register" data-i18n="login_register">Register here</a>
            </div>
            <div style="text-align:center;margin-top:var(--space-lg);">
                <a href="/" style="color:var(--text-muted);font-size:0.85rem;">← Back to Home</a>
            </div>
        </div>
    </div>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js?v=2.1"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        // Redirect if already logged in
        if (isLoggedIn()) {
            const user = getUser();
            window.location.href = user && user.role === 'admin' ? '/admin' : '/dashboard';
        }
    </script>
</body>
</html>
